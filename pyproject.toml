# Documentation de poetry: https://python-poetry.org/docs/pyproject/

[tool.poetry]
name = "eoqual-resampling"
version = "0.1.0"
description = "Image downsampling methods for Earth observation"
authors = ["Olivier Amram <olivier.amram@free.fr>"]
maintainers = [
    "Olivier Amram <olivier.amram@free.fr>"
]
repository = "https://github.com/EOQual/eoqual-resampling.git"
readme = "README.md"
license = "MIT"
keywords = ["resampling", "downsampling", "anti-aliasing", "sinc", "mtf", "earth-observation"]
packages = [{include = "eoqual/resampling", from = "src"}]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Décomposition périodique + lisse (méthodes spectrales), épinglée sur une
# version : voir les règles de stabilité d'eoqual-core.
eoqual-core = {git = "https://github.com/EOQual/eoqual-core.git", tag = "v0.4.0"}
# Figure des fonctions de transfert (plot_curves).
eoqual-viz = {git = "https://github.com/EOQual/eoqual-viz.git", tag = "v0.2.0"}
numpy = "*"
scipy = "*"
plotly = "*"
rich = "*"

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autoapi = "*"

[tool.poetry.group.dev.dependencies]
poetry = "^2.1.1"
ipython = "^8.8.0"
black = "^23.3.0"
coverage = "^6.5.0"
pylint = "*"
pytest = "<9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
